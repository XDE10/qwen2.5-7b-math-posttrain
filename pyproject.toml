[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen25-math-posttrain"
version = "1.0.0"
description = "Minimalist single-GPU QFFT/SFT, LoRA-GRPO, and 32K evaluation pipeline for Qwen2.5-7B-Instruct"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
data = [
    "datasets>=3.0.0",
    "huggingface-hub>=0.25.0",
    "pandas>=2.2.0",
    "pyarrow>=14.0.0",
]
infer = [
    "accelerate>=1.11.0",
    "huggingface-hub>=0.25.0",
    "peft>=0.14.0",
    "torch>=2.5.0",
    "transformers>=4.48.0",
]
eval = [
    "math-verify[antlr4_13_2]==0.9.0",
    "pandas>=2.2.0",
    "psutil>=5.9.0",
    "pyarrow>=14.0.0",
    "transformers>=5.16.1,<5.21.0",
    "vllm==0.33.0",
]
train = [
    "accelerate>=1.11.0",
    "deepspeed==0.19.9",
    "liger-kernel==0.8.5",
    "ninja",
    "psutil>=5.9.0",
    "torch>=2.5.0",
    "transformers>=5.16.1,<5.21.0",
]
rl = [
    "accelerate>=1.11.0",
    "datasets>=4.7.0",
    "flatbuffers==25.12.19",
    "math-verify[antlr4_13_2]==0.9.0",
    "onnxruntime==1.32.0",
    "peft==0.21.2",
    "psutil>=5.9.0",
    "transformers==5.19.0",
    "trl==1.17.1",
    "vllm==0.32.0",
]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
math-posttrain = "math_posttrain.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers"
